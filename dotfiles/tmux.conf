# --- Basic Settings ---
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g prefix C-s
set -g mouse on
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g status-position top

# --- Pane Navigation (Vim Style) ---
set -g @plugin 'christoomey/vim-tmux-navigator'
# (Your existing vim-tmux-navigator logic remains active via the plugin)

# --- Split and Resize ---
bind-key '/' split-window -h
bind-key '?' split-window
bind-key h resize-pane -L 20 
bind-key l resize-pane -R 20 
bind-key j resize-pane -D 20
bind-key k resize-pane -U 20

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# --- Catppuccin Theme Customization ---
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
# This shows: WindowName (CurrentIndex/TotalWindows)
set -g @catppuccin_window_current_text "#W (#I/#{session_windows})"

set -g @catppuccin_status_modules_right "azure kube directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# --- THE "ONE SCREEN" MAGIC & TOGGLE ---
# Initialize TPM first so Catppuccin loads its defaults
run '~/.tmux/plugins/tpm/tpm'

# NOW override to hide inactive windows by default
set-window-option -g window-status-format ""

# Toggle Shortcut: Prefix + t
# It switches the inactive window format between "empty" and "visible"
bind-key t run-shell " \
    if [ \"$(tmux show-window-option -gv window-status-format)\" = \"\" ]; then \
        tmux set-window-option -g window-status-format '#I:#W#F '; \
    else \
        tmux set-window-option -g window-status-format ''; \
    fi"
